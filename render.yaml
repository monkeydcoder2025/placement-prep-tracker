services:
  - type: web
    name: placement-prep-tracker
    runtime: node
    buildCommand: npm install && cd server && npm install && cd ../client && npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production
      - key: API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
